name: BobTV coordinated Windows release candidates
on:
  push:
    branches: [release/1.1.15-operations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bobtv-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Preserve checksum-locked LF source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 03b20a9aa0d89bc7709645324736f69310c6d213
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build pinned AirPlay dependencies
        shell: pwsh
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'fpsap-source'
          git clone https://github.com/objevovat/fairplay-sap-core-airplay2-sender-authentication-handshake.git $source
          if($LASTEXITCODE){throw 'FPSAP clone failed'}
          git -C $source checkout --detach 370f9db2e26b21b4a710bdba5d51012c1239e736
          if($LASTEXITCODE){throw 'FPSAP revision failed'}
          Push-Location $source
          try {go mod download;if($LASTEXITCODE){throw 'Go dependency download failed'}} finally {Pop-Location}
          & tools/airplay/build-fpsap.ps1 -SourceDirectory $source -OutputDirectory build/fpsap-dist
          & tools/airplay/build.ps1
      - name: Build architecture-verified application
        shell: pwsh
        run: |
          & tools/windows/prepare_signpath_bundle.ps1 -Architecture '${{ matrix.architecture }}' -FlutterDirectory $env:FLUTTER_ROOT -OutputDirectory (Join-Path $env:RUNNER_TEMP 'BobTVBuild')
      - name: Test update recovery and real progress window
        shell: pwsh
        run: |
          flutter test test/region_navigation_test.dart test/windows_update_authorization_poll_test.dart test/desktop_update_feedback_test.dart test/update_manifest_test.dart
          if($LASTEXITCODE){throw 'Flutter update regression'}
          & tools/windows/test_update_recovery_logic.ps1
          & tools/windows/test_update_helpers.ps1
          # The cross-build job also retains its native x64 fixture.
          $fixture=Join-Path $env:RUNNER_TEMP 'BobTVBuild/x64-support/BobTV/BobTV.exe'
          & tools/windows/test_update_progress_ui.ps1 -ExecutablePath $fixture
      - name: Package installer and portable update
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'release-candidates'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if(!(Test-Path $compiler)){throw 'Official Inno Setup 6 compiler missing'}
          & tools/windows/build_installer.ps1 -BundleDirectory $env:BOBTV_BUNDLE -OutputDirectory $out -CompilerPath $compiler -Architecture '${{ matrix.architecture }}'
          if('${{ matrix.architecture }}' -eq 'x64'){
            & tools/windows/test_installer.ps1 -BundleDirectory $env:BOBTV_BUNDLE -CompilerPath $compiler
          }
          $zip=Join-Path $out "BobTV-$env:BOBTV_VERSION-windows-${{ matrix.architecture }}.zip"
          Compress-Archive -LiteralPath $env:BOBTV_BUNDLE -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item $env:BOBTV_PROVENANCE (Join-Path $out 'build-provenance.json')
          Get-FileHash "$out/*" -Algorithm SHA256|ConvertTo-Json|Set-Content (Join-Path $out 'candidate-hashes.json')
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BobTV-1.1.15-windows-${{ matrix.architecture }}
          path: release-candidates/*
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BobTV-1.1.15-windows-${{ matrix.architecture }}-diagnostics
          path: windows-live-update-diagnostics/**
          retention-days: 1
          if-no-files-found: ignore
