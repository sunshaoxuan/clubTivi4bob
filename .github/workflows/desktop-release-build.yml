name: Desktop Release Build

on:
  push:
    branches:
      - agent/bobtv-desktop-release-*
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platforms to build
        default: all
        type: choice
        options: [all, windows, macos]

jobs:
  shared-sync:
    name: Shared channel sync contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r website/requirements.txt pytest httpx
      - run: flutter pub get
      - run: python -m pytest website/tests -q
      - name: Test real HTTP sync across independent clients
        run: BOBTV_SYNC_E2E_PYTHON="$(command -v python)" flutter test test/shared_catalog_http_e2e_test.dart
  macos:
    if: inputs.platform != 'windows'
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: flutter pub get
      - name: Test macOS render worker disposal ordering
        run: |
          swiftc third_party/media_kit_video/macos/Classes/plugin/common/Worker.swift tools/macos/test_video_worker.swift -o "$RUNNER_TEMP/video-worker-test"
          "$RUNNER_TEMP/video-worker-test"
          swiftc third_party/media_kit_video/macos/Classes/plugin/common/VideoOutputManager.swift tools/macos/test_video_output_manager.swift -o "$RUNNER_TEMP/video-manager-test"
          "$RUNNER_TEMP/video-manager-test"
      - run: >-
          flutter test test/website_channel_catalog_service_test.dart
          test/channel_inventory_sync_service_test.dart test/manual_channel_category_test.dart test/update_manifest_test.dart
          test/shared_catalog_events_test.dart test/shared_sync_badge_test.dart
          test/manual_category_move_test.dart test/channel_category_picker_interaction_test.dart
          test/desktop_update_feedback_test.dart
          test/lightweight_background_test.dart test/route_identity_test.dart
          test/desktop_fullscreen_session_test.dart
          test/window_manager_fullscreen_backend_test.dart
          test/fullscreen_return_navigation_test.dart
          test/channel_startup_progress_test.dart test/channel_list_identity_test.dart
          test/channel_programme_preview_test.dart test/channel_programme_strip_test.dart
          test/inline_expanded_channel_grid_test.dart test/upcoming_programmes_test.dart
          test/channel_card_feedback_test.dart
      - name: Fetch pinned AirPlay authentication source
        run: |
          git clone https://github.com/objevovat/fairplay-sap-core-airplay2-sender-authentication-handshake.git "$RUNNER_TEMP/fpsap-source"
          git -C "$RUNNER_TEMP/fpsap-source" checkout --detach 370f9db2e26b21b4a710bdba5d51012c1239e736
      - name: Build and verify macOS app
        run: |
          bash tools/macos/build.sh "$RUNNER_TEMP/fpsap-source"
          codesign --verify --deep --strict build/macos/Build/Products/Release/BobTV.app
          plutil -lint build/macos/Build/Products/Release/BobTV.app/Contents/Info.plist
      - name: Test sustained native audio/video playback and PiP memory
        run: |
          app=build/macos/Build/Products/Release/BobTV.app
          ditto "$app" "$RUNNER_TEMP/BobTV-release-preserved.app"
          flutter build macos --release --target tools/windows/native_video_disposal_probe.dart
          python3 tools/windows/make_video_disposal_fixture.py "$RUNNER_TEMP/playback.avi"
          export BOBTV_NATIVE_DISPOSAL_MEDIA="$RUNNER_TEMP/playback.avi"
          export BOBTV_NATIVE_DISPOSAL_LOG="$RUNNER_TEMP/playback.log"
          export BOBTV_NATIVE_SOAK_SECONDS=600
          "$app/Contents/MacOS/BobTV" &
          probe=$!
          for ((n=0; n<780; n++)); do
            kill -0 "$probe" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$probe" 2>/dev/null; then
            cat "$BOBTV_NATIVE_DISPOSAL_LOG" || true
            kill "$probe"
            exit 1
          fi
          result=0
          wait "$probe" || result=$?
          cat "$BOBTV_NATIVE_DISPOSAL_LOG" || true
          if [ "$result" != 0 ]; then
            for report in "$HOME/Library/Logs/DiagnosticReports"/BobTV*.ips; do
              if [ -f "$report" ]; then cat "$report"; fi
            done
            exit "$result"
          fi
          grep -q 'PASS: 600 second dual-player AV soak' "$BOBTV_NATIVE_DISPOSAL_LOG"
          ditto "$RUNNER_TEMP/BobTV-release-preserved.app" "$app"
          codesign --verify --deep --strict "$app"
      - name: Verify native MPV render-context release
        run: bash tools/macos/test_native_video_disposal.sh "$PWD/build/macos/Build/Products/Release/BobTV.app"
      - name: Verify owned Metal frame lifetime
        run: bash tools/macos/test_owned_metal_frame.sh "$PWD/build/macos/Build/Products/Release/BobTV.app"
      - name: Package macOS installer and update archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app=build/macos/Build/Products/Release/BobTV.app
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          python3 -m pip install dmgbuild==1.6.7
          bash tools/macos/package_dmg.sh "$app" "BobTV-${version}-macos-${ARCH}.dmg"
          ditto -c -k --norsrc --keepParent "$app" "BobTV-macos-${ARCH}-update.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BobTV-macos-${{ matrix.arch }}
          path: |
            BobTV-*-macos-${{ matrix.arch }}.dmg
            BobTV-macos-${{ matrix.arch }}-update.zip
          if-no-files-found: error

  windows:
    if: inputs.platform != 'macos'
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Windows AirPlay helper and native authentication adapter
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'fpsap-source'
          git clone https://github.com/objevovat/fairplay-sap-core-airplay2-sender-authentication-handshake.git $source
          git -C $source checkout --detach 370f9db2e26b21b4a710bdba5d51012c1239e736
          Push-Location $source
          try { go mod download } finally { Pop-Location }
          & tools/airplay/build-fpsap.ps1 -SourceDirectory $source -OutputDirectory build/fpsap-dist
          & tools/airplay/build.ps1
      - run: flutter pub get
      - run: >-
          flutter test test/website_channel_catalog_service_test.dart
          test/channel_inventory_sync_service_test.dart test/manual_channel_category_test.dart test/update_manifest_test.dart
          test/shared_catalog_events_test.dart test/shared_sync_badge_test.dart
          test/manual_category_move_test.dart test/channel_category_picker_interaction_test.dart
          test/desktop_update_feedback_test.dart
          test/lightweight_background_test.dart test/route_identity_test.dart
          test/desktop_fullscreen_session_test.dart
          test/window_manager_fullscreen_backend_test.dart
          test/fullscreen_return_navigation_test.dart
          test/channel_startup_progress_test.dart test/channel_list_identity_test.dart
          test/channel_programme_preview_test.dart test/channel_programme_strip_test.dart
          test/inline_expanded_channel_grid_test.dart test/upcoming_programmes_test.dart
      - name: Test real Windows video disposal before mpv core destruction
        shell: pwsh
        run: |
          flutter build windows --release --target tools/windows/native_video_disposal_probe.dart
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture build failed' }
          $fixture = Join-Path $env:RUNNER_TEMP 'bobtv-disposal.avi'
          python tools/windows/make_video_disposal_fixture.py $fixture
          $env:BOBTV_NATIVE_DISPOSAL_MEDIA = $fixture
          $env:BOBTV_NATIVE_DISPOSAL_LOG = Join-Path $env:RUNNER_TEMP 'bobtv-disposal.log'
          $env:BOBTV_NATIVE_SOAK_SECONDS = '600'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'BobTVNativeDisposal'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $exe = Join-Path $PWD 'build/windows/x64/runner/Release/clubtivi.exe'
          $probe = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          if (!$probe.WaitForExit(780000)) {
            Get-Content -LiteralPath $env:BOBTV_NATIVE_DISPOSAL_LOG -ErrorAction SilentlyContinue
            Stop-Process -Id $probe.Id -Force
            throw 'Native fixture timeout'
          }
          $probe.Refresh()
          $log = Get-Content -LiteralPath $env:BOBTV_NATIVE_DISPOSAL_LOG -Raw
          Write-Output $log
          if ($probe.ExitCode -ne 0 -or $log -notmatch 'PASS: 600 second dual-player AV soak') { throw 'Native playback regression' }
      - run: flutter build windows --release --target lib/main.dart
      - name: Test Windows CRT bundling safeguards
        shell: pwsh
        run: '& tools/windows/test_bundle_vc_runtime.ps1'
      - name: Package portable Windows app
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+\+\d+$') { throw 'Invalid BobTV version' }
          $bundle = Join-Path $env:RUNNER_TEMP 'BobTV'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item -Path 'build\windows\x64\runner\Release\*' -Destination $bundle -Recurse -Force
          Rename-Item -LiteralPath (Join-Path $bundle 'clubtivi.exe') -NewName 'BobTV.exe'
          if (-not (Test-Path (Join-Path $bundle 'AirPlay/bobtv-airplay.exe')) -or
              -not (Test-Path (Join-Path $bundle 'AirPlay/fpsap-auth.exe'))) { throw 'AirPlay components missing' }
          if ((Get-Item (Join-Path $bundle 'BobTV.exe')).VersionInfo.FileVersion -ne $version) { throw 'Version mismatch' }
          & tools/windows/bundle_vc_runtime.ps1 -BundleDirectory $bundle
          Compress-Archive -Path $bundle -DestinationPath "BobTV-$version-windows-x64.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: BobTV-windows-x64
          path: BobTV-*-windows-x64.zip
          if-no-files-found: error
