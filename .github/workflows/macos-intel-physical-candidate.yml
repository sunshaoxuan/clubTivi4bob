name: macOS Intel Candidate for Physical Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Fetch pinned AirPlay authentication source
        run: |
          git clone https://github.com/objevovat/fairplay-sap-core-airplay2-sender-authentication-handshake.git "$RUNNER_TEMP/fpsap-source"
          git -C "$RUNNER_TEMP/fpsap-source" checkout --detach 370f9db2e26b21b4a710bdba5d51012c1239e736
      - name: Build production candidate and independently executable probe
        run: |
          bash tools/macos/build.sh "$RUNNER_TEMP/fpsap-source"
          app=build/macos/Build/Products/Release/BobTV.app
          codesign --verify --deep --strict "$app"
          ditto "$app" "$RUNNER_TEMP/BobTV-main.app"
          flutter build macos --release --target tools/windows/native_video_disposal_probe.dart
          codesign --verify --deep --strict "$app"
          ditto -c -k --norsrc --keepParent "$app" BobTV-macos-x64-native-probe.zip
          python3 tools/windows/make_video_disposal_fixture.py playback.avi
          ditto "$RUNNER_TEMP/BobTV-main.app" "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --norsrc --keepParent "$app" BobTV-macos-x64-update.zip
          python3 -m pip install dmgbuild==1.6.7
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          bash tools/macos/package_dmg.sh "$app" "BobTV-${version}-macos-x64.dmg"
      - name: Mark artifacts as unverified hardware candidates
        run: |
          echo 'NOT RELEASE QUALIFIED: physical Intel GUI soak, native teardown and GPU readback tests are required before publication.' > HARDWARE-VALIDATION-REQUIRED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BobTV-macos-x64-hardware-candidate
          path: |
            BobTV-*-macos-x64.dmg
            BobTV-macos-x64-update.zip
            BobTV-macos-x64-native-probe.zip
            playback.avi
            HARDWARE-VALIDATION-REQUIRED.txt
          if-no-files-found: error
