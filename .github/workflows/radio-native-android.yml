name: BobTV Android real audio spectrum runtime
on:
  push:
    branches: [release/bobtv-1.1.14]
    paths:
      - tools/native/af_bobtv_spectrum.c
      - tools/native/build_android_spectrum.py
      - .github/workflows/radio-native-android.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Android ${{ matrix.arch }} FFT runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated runner build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool gettext nasm pkg-config cmake ninja-build python3-pip
          python -m pip install meson==1.3.2 jsonschema jinja2
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' > "$RUNNER_TEMP/ndk-setup.log"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bobtv-android-native
          key: radio-fft-ndk28-${{ matrix.arch }}-${{ hashFiles('tools/native/af_bobtv_spectrum.c','tools/native/build_android_spectrum.py') }}
      - name: Build the pinned native runtime with the production FFT analyzer
        run: python tools/native/build_android_spectrum.py --arch '${{ matrix.arch }}' --cache "$RUNNER_TEMP/bobtv-android-native" --output native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: radio-native-android-${{ matrix.arch }}
          path: native-artifacts
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: radio-native-android-${{ matrix.arch }}-logs
          path: |
            ${{ runner.temp }}/bobtv-android-native/upstream/buildscripts/deps/**/meson-logs/meson-log.txt
            ${{ runner.temp }}/bobtv-android-native/upstream/buildscripts/deps/**/ffbuild/config.log
