name: BobTV 1.1.15 final main regression
on:
  push:
    branches: [release/1.1.15-final-regression]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r website/requirements.txt httpx pytest
      - run: git rev-parse HEAD
      - run: python -m pytest website/tests -q
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: git rev-parse HEAD
      - run: flutter pub get
      - name: Resolve retained standalone media investigation package
        working-directory: third_party/media_kit
        run: dart pub get --enforce-lockfile
      - run: flutter test --no-pub
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
