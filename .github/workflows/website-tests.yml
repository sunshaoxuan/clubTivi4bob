name: BobTV Website Tests

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/website-tests.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r website/requirements.txt pytest httpx
      - name: Test website and API
        run: python -m pytest website/tests -q
