name: BobTV Website Tests

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/website-tests.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r website/requirements.txt pytest httpx
      - name: Test website and API
        run: python -m pytest website/tests -q

  preview-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install -r website/requirements.txt
          npm install --prefix website/.test-output/browser --no-audit --no-fund playwright@1.58.2 sharp@0.34.5
          website/.test-output/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check product preview behavior and pixels
        env:
          NODE_PATH: ${{ github.workspace }}/website/.test-output/browser/node_modules
        run: |
          python -m uvicorn app:app --app-dir website --host 127.0.0.1 --port 8924 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8924/new/ >/dev/null; then break; fi
            sleep 1
          done
          node website/tests/new-preview.cjs
