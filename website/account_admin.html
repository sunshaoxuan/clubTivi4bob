<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BobTV 用户管理</title><link rel="stylesheet" href="/admin/accounts.css"><script src="/admin/accounts.js" defer></script>
<header><strong>BobTV</strong><span>用户管理</span><button id="logout" hidden>退出登录</button></header><main>
<p id="status" role="status" aria-live="polite"></p>
<section id="login"><h1>管理员登录</h1><p>仅限指定管理员账号。请输入邮箱接收验证码。</p><form id="login-form"><label>邮箱<input id="email" type="email" required autocomplete="email" maxlength="254"></label><button id="send" type="button">发送验证码</button><label>验证码<input id="code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code" maxlength="6"></label><button>验证并登录</button></form><div id="providers"></div></section>
<section id="management" hidden><h1>账号管理</h1><form id="search-form"><input id="query" placeholder="搜索邮箱或名称" aria-label="搜索用户" maxlength="100"><button>搜索</button><button type="button" id="new">创建用户</button></form><div class="table-wrap"><table><thead><tr><th>邮箱</th><th>名称</th><th>验证</th><th>状态</th><th>角色</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><button id="previous">上一页</button><button id="next">下一页</button></section>
<dialog id="editor"><form id="edit-form"><h2 id="edit-title">编辑用户</h2><label>邮箱<input id="edit-email" type="email" required maxlength="254"></label><label>名称<input id="edit-name" maxlength="100"></label><label class="check"><input id="edit-verified" type="checkbox">验证通过</label><label class="check"><input id="edit-disabled" type="checkbox">禁用账号并撤销已有登录</label><p>修改邮箱或验证状态也会撤销已有登录。第三方登录账号的邮箱由身份提供方管理。</p><div><button>保存</button><button id="cancel" type="button">取消</button></div></form></dialog></main></html>
