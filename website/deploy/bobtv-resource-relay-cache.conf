# Included at Nginx http scope, separate from existing mail/site configuration.
proxy_cache_path /var/cache/bobtv-relay levels=1:2 keys_zone=bobtv_resources:16m
    max_size=8g inactive=14d use_temp_path=off;
log_format bobtv_resource '$time_iso8601 $request_method $uri $status '
    '$body_bytes_sent $request_time $upstream_cache_status';
map $uri $bobtv_resource_cache {
    default 0;
    ~^/bobtv/updates/files/BobTV- 1;
    ~^/bobtv/downloads/BobTV- 1;
    ~^/bobtv/api/v1/channel-catalog/snapshots/ 1;
    ~^/bobtv/api/v1/egress/logo-index$ 1;
}
map "$uri:$arg_kind" $bobtv_metadata_cache {
    default 0;
    '/bobtv/api/v1/egress/resource:image' 1;
    '/bobtv/api/v1/egress/resource:epg' 1;
}
map "$bobtv_resource_cache:$bobtv_metadata_cache" $bobtv_cacheable {
    default 1;
    '0:0' 0;
}
map $bobtv_cacheable $bobtv_resource_bypass { 0 1; 1 0; }
map $http_authorization $bobtv_private_request { default 1; '' 0; }
map "$bobtv_resource_bypass:$bobtv_private_request" $bobtv_if_none_match {
    default $http_if_none_match;
    '0:0' '';
}
map "$bobtv_resource_bypass:$bobtv_private_request" $bobtv_if_modified_since {
    default $http_if_modified_since;
    '0:0' '';
}
map $upstream_cache_status $bobtv_cache_status {
    default $upstream_cache_status;
    '' BYPASS;
}
