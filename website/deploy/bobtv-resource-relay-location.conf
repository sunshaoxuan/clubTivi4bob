# Included ONLY in the existing cndrp.com HTTPS server block.
location ^~ /bobtv/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8927;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_cache bobtv_resources;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_valid 200 1d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_cache_bypass $bobtv_resource_bypass $bobtv_private_request;
    proxy_no_cache $bobtv_resource_bypass $bobtv_private_request;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    add_header X-BobTV-Cache $bobtv_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin https://bobtv.briconbric.com always;
    add_header Access-Control-Expose-Headers "X-BobTV-Probe, X-BobTV-Node, X-BobTV-Cache, Content-Length" always;
    access_log /var/log/nginx/bobtv-resource.log bobtv_resource;
}
