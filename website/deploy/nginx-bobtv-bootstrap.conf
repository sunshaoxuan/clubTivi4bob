# Temporary ACME bootstrap. Replace with nginx-bobtv.conf after issuance.
server {
    listen 80;
    server_name bobtv.briconbric.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bobtv-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bobtv.briconbric.com;
    ssl_certificate /etc/letsencrypt/live/briconbric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/briconbric.com/privkey.pem;
    include snippets/ssl-params.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bobtv-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
