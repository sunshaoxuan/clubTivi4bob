server {
    listen 80;
    server_name bobtv.briconbric.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bobtv-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bobtv.briconbric.com;

    ssl_certificate /etc/letsencrypt/live/bobtv.briconbric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bobtv.briconbric.com/privkey.pem;
    include snippets/ssl-params.conf;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bobtv-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8917;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
