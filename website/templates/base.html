<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ t.meta[page] }}">
  <title>{{ t.titles[page] }}</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
  <link rel="stylesheet" href="/assets/site.css?v=12">
  {% for code in languages %}<link rel="alternate" hreflang="{{ code }}" href="{{ path }}?lang={{ code }}">{% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ path }}?lang=en">
</head>
<body class="{{ 'home' if page == 'index' else page }}-page">
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="/?lang={{ locale }}" aria-label="BobTV"><span class="brand-mark">▶</span>Bob<span>TV</span></a>
    <nav aria-label="{{ t.nav_label }}">
      {% for key, url in [('index', '/'), ('downloads', '/downloads'), ('diagnostics', '/diagnostics')] %}
      <a href="{{ url }}?lang={{ locale }}"{% if page == key %} aria-current="page"{% endif %}>{{ t.nav[key] }}</a>
      {% endfor %}
    </nav>
    <form class="language-form" action="{{ path }}" method="get">
      <label class="visually-hidden" for="language">{{ t.language }}</label>
      <select id="language" name="lang" aria-label="{{ t.language }}">
        {% for code, label in languages.items() %}<option value="{{ code }}"{% if code == locale %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </form>
  </div></header>
  {% block content %}{% endblock %}
  <footer><div class="container footer-inner"><span>{{ t.footer }}</span><span>{{ t.disclaimer }}</span></div></footer>
  <script id="site-messages" type="application/json">{{ t.messages | tojson }}</script>
  <script src="/assets/language.js?v=1" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
